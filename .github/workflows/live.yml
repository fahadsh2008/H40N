name: Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create Video List
        run: |
          # استبعاد break.mp4 وترتيب الفيديوهات تصاعدياً بالشكل الصحيح حتى 26 وما فوق
          find . -maxdepth 2 -type f -name "*.mp4" ! -name "break.mp4" | sort -V | sed "s/^/file '/;s/$/'/" > playlist.txt
          cat playlist.txt

      - name: Start Live Stream
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          ffmpeg -re -f concat -safe 0 -stream_loop -1 -i playlist.txt \
          -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
