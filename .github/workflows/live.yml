name: Stream to OneStream Live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0 -p "2.mp4"

      - name: Start Stream
        env:
          ONESTREAM_URL: ${{ secrets.ONESTREAM_URL }}
          ONESTREAM_KEY: ${{ secrets.ONESTREAM_KEY }}
        run: |
          ffmpeg -re -stream_loop -1 -i "2.mp4" \
          -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
          -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 \
          -f flv "${ONESTREAM_URL}/${ONESTREAM_KEY}"
