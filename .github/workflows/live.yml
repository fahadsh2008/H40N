name: Live Stream 24/7

on:
  schedule:
    # يعمل تلقائياً كل 5 ساعات (تحديد الدقيقة 0 وكل 5 ساعات)
    - cron: '0 */5 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى ما أردت

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 1. استرجاع رقم الفيديو الأخير الذي توقفنا عنده
      - name: Restore Current Video Index
        uses: actions/cache@v3
        with:
          path: video_index.txt
          key: video-index-cache-${{ github.run_id }}
          restore-keys: |
            video-index-cache-

      # 2. بدء البث والانتقال للفيديو التالي
      - name: Start Live Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # إذا لم يكن ملف العداد موجوداً، نبدأ من الفيديو رقم 1
          if [ ! -f video_index.txt ]; then
            echo "1" > video_index.txt
          fi

          INDEX=$(cat video_index.txt)
          VIDEO_FILE="videos/${INDEX}.mp4"

          # إذا انتهت جميع الفيديوهات في المجلد، أعد البدء من الفيديو رقم 1
          if [ ! -f "$VIDEO_FILE" ]; then
            echo "1" > video_index.txt
            INDEX=1
            VIDEO_FILE="videos/1.mp4"
          fi

          echo "جارٍ الآن بث الفيديو: $VIDEO_FILE"

          # تجهيز رقم الفيديو القادم للمرة القادمة
          NEXT_INDEX=$((INDEX + 1))
          echo "$NEXT_INDEX" > video_index.txt

          # تشغيل FFmpeg لمدة أقل بقليل من 5 ساعات (مثلاً 4 ساعات و 50 دقيقة) ليتم إعادة التشغيل بأمان
          # أو ترك FFmpeg يبث حتى يفصل الـ Action بعد 5 ساعات
          ffmpeg -re -i "$VIDEO_FILE" -c:v libx264 -preset ultrafast -b:v 3000k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

      # 3. حفظ رقم الفيديو الجديد للعملية القادمة
      - name: Save Next Video Index
        if: always()
        uses: actions/cache@v3
        with:
          path: video_index.txt
          key: video-index-cache-${{ github.run_id }}
