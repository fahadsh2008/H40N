name: YouTube Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Rotate Playlist (Move first video to end)
        run: |
          if [ -s playlist.txt ]; then
            first_line=$(head -n 1 playlist.txt)
            tail -n +2 playlist.txt > temp_playlist.txt
            echo "$first_line" >> temp_playlist.txt
            mv temp_playlist.txt playlist.txt
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git add playlist.txt
            git commit -m "Auto-rotate playlist: moved played video to end" || echo "No changes to commit"
            git push || echo "Push failed or not needed"
          fi

      - name: Download All Assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p videos
          gh release download --dir videos --pattern '*' --repo fahadsh2008/H40N || true

      - name: Prepare Playlist
        run: |
          rm -f local_playlist.txt
          while IFS= read -r line || [[ -n "$line" ]]; do
            filename=$(echo "$line" | sed "s/file '\(.*\)'/\1/" | xargs basename)
            if [ -f "videos/$filename" ]; then
              echo "file 'videos/$filename'" >> local_playlist.txt
            elif [ -f "$filename" ]; then
              echo "file '$filename'" >> local_playlist.txt
            fi
          done < playlist.txt
          cat local_playlist.txt

      - name: Verify Files
        run: |
          echo "--- Checking Playlist Content ---"
          cat local_playlist.txt
          echo "--- Checking Downloaded Video Sizes ---"
          ls -lh videos/

      - name: Start Live Stream
        run: |
          ffmpeg -re -stream_loop -1 -f concat -safe 0 -i local_playlist.txt \
          -t 18000 \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 -keyint_min 60 -r 30 \
          -c:a aac -b:a 128k -ar 44100 -ac 2 \
          -fflags +genpts \
          -f flv "rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}"
