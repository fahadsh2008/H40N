name: live

concurrency:
  group: youtube-live-stream-continuous
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg & GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg gh

      - name: Force Kill Any Existing FFmpeg
        run: |
          pkill -9 ffmpeg || true
          killall -9 ffmpeg || true
          sleep 2

      - name: Rotate Playlist (Move first video to end)
        run: |
          if [ -f playlist.txt ] && [ -s playlist.txt ]; then
            sed -i 's/\r$//' playlist.txt
            first_line=$(head -n 1 playlist.txt | tr -d '\r')
            
            tail -n +2 playlist.txt | grep -v '^$' > temp_playlist.txt
            echo "$first_line" >> temp_playlist.txt
            mv temp_playlist.txt playlist.txt
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            
            git pull origin ${{ github.ref_name }} --rebase || true
            git add playlist.txt
            git commit -m "Auto-rotate playlist: moved played video to end" || echo "No changes to commit"
            git push origin HEAD:${{ github.ref_name }} || echo "Push failed or not needed"
          else
            echo "playlist.txt not found or empty!"
          fi

      - name: Download All Assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p videos
          gh release download --dir videos --pattern '*' --repo fahadsh2008/H40N || true

      - name: Prepare Playlist
        run: |
          rm -f local_playlist.txt
          if [ -f playlist.txt ]; then
            sed -i 's/\r$//' playlist.txt
            
            while IFS= read -r line || [[ -n "$line" ]]; do
              [ -z "$line" ] && continue
              if [[ "$line" =~ ^file ]]; then
                filename=$(echo "$line" | sed "s/file '\(.*\)'/\1/" | xargs basename)
                if [ -f "videos/$filename" ]; then
                  echo "file 'videos/$filename'" >> local_playlist.txt
                elif [ -f "$filename" ]; then
                  echo "file '$filename'" >> local_playlist.txt
                fi
              fi
            done < playlist.txt
          else
            echo "Error: playlist.txt does not exist!"
            exit 1
          fi

      - name: Start Stream Loop with Live Metrics Monitoring
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkill -9 ffmpeg || true
          
          # حلقة تكرار ذكية تراقب تدفق البيانات وتكتشف التعليق فوراً
          while true; do
            echo "Starting FFmpeg stream session with smart monitoring..."
            
            # تشغيل FFmpeg وتوجيه مخرجاته لتحليل الأداء وتدفق الإطارات
            ffmpeg -re -stream_loop -1 -f concat -safe 0 -i local_playlist.txt \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30,format=yuv420p" \
            -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2800k -bufsize 5600k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -f flv -flvflags no_duration_filesize+no_sequence_end \
            "rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}" \
            2>&1 | while read -r line; do
                echo "$line"
                # إذا اكتشفنا أن الـ FFmpeg توقف عن الإرسال أو حدث جمود (توقف تدفق الإطارات)، نقطع العملية فوراً
                if echo "$line" | grep -q "Exiting normally" || echo "$line" | grep -q "Connection refused" || echo "$line" | grep -q "Server returned 4xx"; then
                    echo "Stream error or drop detected in logs. Killing FFmpeg..."
                    pkill -9 ffmpeg || true
                fi
            done
            
            echo "Stream disconnected or stalled. Resetting handshake in 5 seconds..."
            pkill -9 ffmpeg || true
            sleep 5
          done &
          
          # المراقب العام للسيرفر: إذا توقفت المهمة كلياً لأي سبب، ينتظر 10 دقائق ثم يعيد إطلاقها
          pid=$!
          wait $pid || true
          
          echo "Job stopped. Waiting 10 minutes before triggering a fresh workflow instance..."
          sleep 600
          
          gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" || true
