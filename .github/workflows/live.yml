name: Live Stream 24/7

on:
  schedule:
    # يعمل تلقائياً كل 5 ساعات
    - cron: '0 */5 * * *'
  workflow_dispatch: # يتيح لك التشغيل اليدوي في أي وقت

jobs:
  stream:
    runs-on: ubuntu-latest

    permissions:
      contents: write # لإعطاء صلاحية التعديل وحفظ رقم الفيديو في المستودع

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. تثبيت FFmpeg
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 2. إعداد معلومات Git لتحديث ملف العداد
      - name: Setup Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 3. بدء البث والانتقال للفيديو التالي
      - name: Start Live Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # إنشاء مجلد videos وملف العداد إذا لم يكونا موجودين
          if [ ! -d "videos" ]; then
            echo "مجلد videos غير موجود!"
            exit 1
          fi

          if [ ! -f video_index.txt ]; then
            echo "1" > video_index.txt
          fi

          INDEX=$(cat video_index.txt)
          VIDEO_FILE="videos/${INDEX}.mp4"

          # إذا وصل للآخر ولم يجد الفيديو، يعود للفيديو رقم 1
          if [ ! -f "$VIDEO_FILE" ]; then
            echo "1" > video_index.txt
            INDEX=1
            VIDEO_FILE="videos/1.mp4"
          fi

          if [ ! -f "$VIDEO_FILE" ]; then
            echo "خطأ: لا يوجد أي فيديو باسم 1.mp4 داخل مجلد videos!"
            exit 1
          fi

          echo "جارٍ الآن بث الفيديو: $VIDEO_FILE"

          # تجهيز رقم الفيديو القادم وحفظه مباشرة في المستودع
          NEXT_INDEX=$((INDEX + 1))
          echo "$NEXT_INDEX" > video_index.txt

          git add video_index.txt
          git commit -m "Update video index to $NEXT_INDEX [skip ci]" || echo "No changes to commit"
          git push || echo "Failed to push index update"

          # تشغيل البث
          ffmpeg -re -i "$VIDEO_FILE" -c:v libx264 -preset ultrafast -b:v 3000k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
