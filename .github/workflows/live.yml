name: YouTube Live Stream 4 Sessions (5h each)

concurrency:
  group: youtube-live-stream
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # الأوقات بتوقيت UTC (توقيت السعودية ناقص 3 ساعات):
    # الدورة الأولى: 3:00 ص (6:00 ص بتوقيت السعودية)
    # الدورة الثانية: 9:00 ص (12:00 ظهراً بتوقيت السعودية)
    # الدورة الثالثة: 15:00 (3:00 عصراً UTC = 6:00 م بتوقيت السعودية)
    # الدورة الرابعة: 21:00 (9:00 م UTC = 12:00 منتصف الليل بتوقيت السعودية)
    - cron: '0 3,9,15,21 * * *'

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # أقل من حد غيت هوب الأقصى (360 دقيقة) لكل دورة
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # --- 1. تدوير قائمة التشغيل بصورة آمنة ---
      - name: Rotate Playlist (Move first video to end)
        run: |
          if [ -f playlist.txt ] && [ -s playlist.txt ]; then
            sed -i 's/\r$//' playlist.txt
            first_line=$(head -n 1 playlist.txt | tr -d '\r')
            
            tail -n +2 playlist.txt | grep -v '^$' > temp_playlist.txt
            echo "$first_line" >> temp_playlist.txt
            mv temp_playlist.txt playlist.txt
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            
            git pull origin ${{ github.ref_name }} --rebase || true
            git add playlist.txt
            git commit -m "Auto-rotate playlist: moved played video to end" || echo "No changes to commit"
            git push origin HEAD:${{ github.ref_name }} || echo "Push failed or not needed"
          else
            echo "playlist.txt not found or empty!"
          fi

      # --- 2. تنزيل الفيديوهات من Release ---
      - name: Download All Assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p videos
          gh release download --dir videos --pattern '*' --repo fahadsh2008/H40N || true

      # --- 3. إعداد القائمة المحلية ---
      - name: Prepare Playlist
        run: |
          rm -f local_playlist.txt
          if [ -f playlist.txt ]; then
            sed -i 's/\r$//' playlist.txt
            
            while IFS= read -r line || [[ -n "$line" ]]; do
              [ -z "$line" ] && continue
              if [[ "$line" =~ ^file ]]; then
                filename=$(echo "$line" | sed "s/file '\(.*\)'/\1/" | xargs basename)
                if [ -f "videos/$filename" ]; then
                  echo "file 'videos/$filename'" >> local_playlist.txt
                elif [ -f "$filename" ]; then
                  echo "file '$filename'" >> local_playlist.txt
                fi
              fi
            done < playlist.txt
          else
            echo "Error: playlist.txt does not exist!"
            exit 1
          fi

      # --- 4. البث لمدة 5 ساعات بالضبط مع إعادة الاتصال التلقائي ---
      - name: Start Live Stream (5 Hours)
        timeout-minutes: 300 # يوقف البث تلقائياً بعد 5 ساعات تماماً
        run: |
          ffmpeg -re -stream_loop -1 -f concat -safe 0 -i local_playlist.txt \
          -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30,format=yuv420p" \
          -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2800k -bufsize 5600k \
          -g 60 -keyint_min 60 \
          -c:a aac -b:a 128k -ar 44100 -ac 2 \
          -flvflags no_duration_filesize \
          -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}" || true
