name: YouTube Live Stream

concurrency:
  group: youtube-live-stream
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # يعمل تلقائياً كل 6 ساعات لبدء الدورة الكبرى

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Download All Assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p videos
          gh release download --dir videos --pattern '*' --repo fahadsh2008/H40N || true

      # --- تشغيل البث في دورات (ساعة بث + تدوير القائمة + 5 دقائق راحة) × 5 مرات ---
      - name: Start Live Stream Loop with Playlist Rotation
        run: |
          for i in {1..5}; do
            echo "=== بدء الدورة رقم $i: تجهيز القائمة المحلية ==="
            
            # 1. إعداد القائمة المحلية بناءً على الترتيب الحالي لملف playlist.txt
            rm -f local_playlist.txt
            sed -i 's/\r$//' playlist.txt
            
            while IFS= read -r line || [[ -n "$line" ]]; do
              [ -z "$line" ] && continue
              if [[ "$line" =~ ^file ]]; then
                filename=$(echo "$line" | sed "s/file '\(.*\)'/\1/" | xargs basename)
                if [ -f "videos/$filename" ]; then
                  echo "file 'videos/$filename'" >> local_playlist.txt
                elif [ -f "$filename" ]; then
                  echo "file '$filename'" >> local_playlist.txt
                fi
              fi
            done < playlist.txt

            # 2. بدء البث لمدة 60 دقيقة
            echo "=== جاري البث لمدة 60 دقيقة للدورة $i ==="
            timeout -s INT 60m ffmpeg -re -stream_loop -1 -f concat -safe 0 -i local_playlist.txt \
            -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -pix_fmt yuv420p -g 60 -keyint_min 60 -r 30 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 \
            -timeout 30000000 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}" || true

            # 3. تدوير القائمة (نقل الفيديو الأول إلى النهاية وحفظه في المستودع)
            echo "=== انتهت الساعة، جاري تدوير القائمة للفيديو التالي ==="
            if [ -s playlist.txt ]; then
              first_line=$(head -n 1 playlist.txt | tr -d '\r')
              tail -n +2 playlist.txt | grep -v '^$' > temp_playlist.txt
              echo "$first_line" >> temp_playlist.txt
              mv temp_playlist.txt playlist.txt
              
              git pull origin main --rebase || true
              git add playlist.txt
              git commit -m "Auto-rotate playlist after hour $i" || echo "No changes to commit"
              git push origin HEAD:main || echo "Push failed or not needed"
            fi

            # 4. توقف مؤقت 5 دقائق قبل الدورة التالية (نتخطاه في الدورة الخامسة)
            if [ $i -lt 5 ]; then
              echo "=== استراحة لمدة 5 دقائق قبل الساعة التالية... ==="
              sleep 300
            fi
          done
          echo "=== اكتملت جميع الدورات الخمس بنجاح ==="
