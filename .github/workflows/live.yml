name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Create Custom Transition Video (توليد الفاصل المعتمد)
        run: |
          ffmpeg -f lavfi -i color=c=0x0B0F19:s=1280x720:r=30 -f lavfi -i anullsrc=cl=stereo:r=44100 \
          -filter_complex "[0:v]drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='FhdXsH':fontcolor=0xF59E0B:fontsize=52:x=(w-text_w)/2:y=(h-text_h)/2[v]" \
          -map "[v]" -map 1:a -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest break.mp4
