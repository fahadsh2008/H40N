name: Live Stream

on:
  workflow_dispatch: # يتيح لك تشغيل البث وإيقافه يدوياً
  push:
    branches: [ "main" ]

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start Streaming
        run: |
          # تم إضافة timeout بـ 5 ساعات و 45 الدقيقة لتجنب إيقاف الـ GitHub Actions بالقوة عند وصول الـ 6 ساعات
          timeout 20700 ffmpeg -re -stream_loop -1 -i 1.mp4 -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}" || true

      - name: Auto Re-run Workflow
        run: |
          echo "Restarting workflow automatically to keep the stream running 24/7..."
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/live.yml/dispatches \
            -d '{"ref":"main"}'
