name: Live Stream

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install FFmpeg and wget
        run: |
          sudo apt update
          sudo apt install -y ffmpeg wget

      - name: Download Large Videos from Releases
        run: |
          wget -O 2.mp4 "https://github.com/fahadsh2008/H40N/releases/download/v1.0/2.mp4"
          wget -O 4.mp4 "https://github.com/fahadsh2008/H40N/releases/download/v1.0/4.mp4"
          wget -O 6.mp4 "https://github.com/fahadsh2008/H40N/releases/download/v1.0/6.mp4"
          wget -O 10.mp4 "https://github.com/fahadsh2008/H40N/releases/download/v1.0/10.mp4"
          wget -O 14.mp4 "https://github.com/fahadsh2008/H40N/releases/download/v1.0/14.mp4"

      - name: Start Stream with FFmpeg
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          ffmpeg -re -f concat -safe 0 -i playlist.txt -c:v libx264 -preset ultrafast -b:v 3000k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -f flv rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY
