name: Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Start Live Stream
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          ffmpeg -re -f lavfi -i color=c=0x0B0F19:s=1280x720:r=30 \
          -f lavfi -i anullsrc=cl=stereo:r=44100 \
          -filter_complex "[0:v]drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='FhdXsH':fontcolor=0xF59E0B:fontsize=52:x=(w-text_w)/2:y=(h-text_h)/2[v]" \
          -map "[v]" -map 1:a \
          -c:v libx264 -preset ultrafast -b:v 2500k \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
