name: YouTube Live Stream

on:
  workflow_dispatch:
  schedule:
    # إعادة تشغيل البث تلقائياً كل 5 ساعات
    - cron: '0 */5 * * *'

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Live Stream
        run: |
          ffmpeg -re -stream_loop -1 -f concat -safe 0 -i playlist.txt \
          -t 18000 \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 -r 30 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}
